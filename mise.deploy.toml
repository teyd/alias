# Tools only a deploy needs (`pnpm infra:deploy`, PLAN.md §20.37), on top of mise.toml. Loaded only
# with MISE_ENV=deploy, so `pnpm agent:setup` and CI never download them. Locked in mise.deploy.lock.
[tools]
aws-cli = "2.38.4" # `aws login` (2.32+) or `aws configure sso`; Alchemy runs the login itself

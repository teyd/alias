name: ci

on:
  pull_request:
  push:
    branches: [main]

# The token can read the repository and nothing else; actions are pinned by commit, so a moved
# tag can't change what runs (PLAN.md §20.25).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: test (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Groups of packages sharing one runner: setup (checkout, mise, install) costs more than most
        # suites. Packages in a group run in parallel; every suite is hermetic (port 0, fresh tables).
        group:
          - name: libraries
            filters: >-
              --filter @alias/core --filter @alias/aws --filter @alias/dns
              --filter @alias/aws-emulators --filter @alias/lambda-emulator
              --filter @alias/doh-emulator --filter @alias/ses-emulator
              --filter @alias/turnstile --filter @alias/turnstile-emulator
          - name: services
            filters: >-
              --filter @alias/db --filter @alias/inbox --filter @alias/webhooks
              --filter @alias/webhooks-lambda --filter @alias/image-proxy --filter @alias/inbound
          - name: api-and-stack
            filters: --filter @alias/api --filter @alias/sdk --filter @alias/cli --filter @alias/extension --filter @alias/e2e
          - name: browser
            filters: --filter @alias/browser
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/alias
          key: dynamodb-local-${{ hashFiles('tools/aws-emulators/src/DynamoDbLocal.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: node tools/aws-emulators/bin/install-dynamodb-local.ts
      # Browser tests: Chromium at the build the catalog's Playwright pins (the full browser, which
      # loads the extension in its new headless mode, and the headless shell), cached by that
      # version. `--with-deps` adds the system libraries it needs even on a cache hit.
      - if: matrix.group.name == 'browser'
        id: playwright
        run: |
          echo "version=$(sed -n 's/^  playwright: //p' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"
      - if: matrix.group.name == 'browser'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # `--with-deps` runs apt-get, and archives from azure.archive.ubuntu.com sometimes crawl at
      # ~60 kB/s for 10-20 minutes (actions/runner-images#14823, open): the apt timeout only covers
      # stalls, not trickles. So drop that mirror (apt falls back to archive.ubuntu.com), retry
      # failed fetches, and fail a slow install after two minutes and try once more.
      - if: matrix.group.name == 'browser'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            [ -s /etc/apt/apt-mirrors.txt ] || echo "http://archive.ubuntu.com/ubuntu/ priority:1" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-apt
          install='pnpm --filter @alias/browser install-browser --with-deps'
          timeout 120 $install || timeout 120 $install
      - run: pnpm ${{ matrix.group.filters }} test

  # Web bundle, SDK bundle and CLI binaries share one runner (one install).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alias/web build
      # The publishable SDK bundle: JS plus inlined declarations, only `effect` left external.
      - run: pnpm --filter @alias/sdk build
      # The `alias` CLI as single-file binaries (bun build --compile). Both targets are built on Linux
      # (Bun cross-compiles); the linux-x64 one is smoke-run here, the darwin-arm64 one only on a Mac.
      # Artifacts only: releasing (npm, Homebrew tap) needs the maintainers' accounts.
      - run: pnpm cli:compile linux-x64 darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alias-cli
          path: apps/cli/dist/alias-*
          if-no-files-found: error

  # The browser extension (PLAN.md §20.35), zipped for the Chrome Web Store and addons.mozilla.org.
  # Artifacts only: publishing needs the maintainers' store accounts. The zips are reproducible.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node and pnpm from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm extension:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alias-extension
          path: apps/extension/dist/alias-*.zip
          if-no-files-found: error

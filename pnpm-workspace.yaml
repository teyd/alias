packages:
  - apps/*
  - packages/*
  - tools/*
  - infra
  - e2e
  - browser

catalogMode: prefer

catalog:
  # toolchain
  vite-plus: 1.3.0
  "@mpsuesser/oxlint-plugin-effect": 0.6.0
  knip: 6.42.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  typescript: ^7.0.2
  "@types/node": ^24
  # effect
  effect: 4.0.5
  "@effect/vitest": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-browser": 4.0.5
  alchemy: 2.0.0-beta.83
  # aws (Effect-native SDK, the same one Alchemy uses)
  "@distilled.cloud/aws": 1.0.0-rc.15
  # web
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.104.5
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # auth (WebAuthn / passkeys)
  "@simplewebauthn/server": 14.0.3
  "@simplewebauthn/browser": 14.0.0
  # mail
  openpgp: 6.3.2
  # inbox mode: sanitizes stored HTML before the API serves it (PLAN.md §20.22)
  sanitize-html: ^2.17.0
  "@types/sanitize-html": ^2.16.0
  smtp-server: 3.20.2
  nodemailer: 10.1.7
  # browser tests (Chromium only; `playwright install` fetches the matching build)
  playwright: 1.64.1
  "@types/nodemailer": 8.0.2
  # api docs: validates the generated OpenAPI document against the official 3.1 schema
  "@seriousme/openapi-schema-validator": 2.11.0
  # mcp: the official TypeScript SDK's client, an independent MCP client for the stack test
  "@modelcontextprotocol/client": 2.3.1
  # ui: shadcn (base-nova style on Base UI), lucide icons, self-hosted Geist fonts
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  shadcn: ^4.22.1
  tw-animate-css: ^1.4.0
  "@base-ui/react": ^1.9.0
  lucide-react: ^1.61.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  # browser extension (PLAN.md §20.35): the WebExtension API's types (Chromium's, which Firefox
  # also implements as `chrome.*`) and the Public Suffix List, for a site's registrable domain
  "@types/chrome": 0.3.6
  tldts: 7.4.19
  "@alias/core": workspace:*

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  # alchemy's Cloudflare provider pulls this in transitively, and we don't run workerd
  workerd: false

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261021.1"

packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

catalogMode: prefer

catalog:
  # toolchain
  vite-plus: 1.3.0
  "@mpsuesser/oxlint-plugin-effect": 0.6.0
  knip: 6.42.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  typescript: ^7.0.2
  "@types/node": ^24
  # effect
  effect: 4.0.5
  "@effect/vitest": 4.0.5
  "@effect/platform-node": 4.0.5
  # aws (Effect-native SDK, the same one Alchemy uses) and local emulators
  "@distilled.cloud/aws": 1.0.0-rc.15
  # web
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@tanstack/react-query": 5.104.5
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # mail
  smtp-server: 3.20.2
  nodemailer: 10.1.7
  "@types/nodemailer": 8.0.2
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  radix-ui: ^1.8.1
  shadcn: ^4.22.1
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

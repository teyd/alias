name: ci

on:
  pull_request:
  push:
    branches: [main]

# The token can read the repository and nothing else; actions are pinned by commit, so a moved
# tag can't change what runs (PLAN.md §20.25).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@alias/core"
          - "@alias/aws"
          - "@alias/dns"
          - "@alias/turnstile"
          - "@alias/db"
          - "@alias/api"
          - "@alias/inbound"
          - "@alias/webhooks"
          - "@alias/inbox"
          - "@alias/webhooks-lambda"
          - "@alias/image-proxy"
          - "@alias/ses-emulator"
          - "@alias/aws-emulators"
          - "@alias/lambda-emulator"
          - "@alias/doh-emulator"
          - "@alias/turnstile-emulator"
          - "@alias/sdk"
          - "@alias/cli"
          - "@alias/e2e"
          - "@alias/browser"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/alias
          key: dynamodb-local-${{ hashFiles('tools/aws-emulators/src/DynamoDbLocal.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: node tools/aws-emulators/bin/install-dynamodb-local.ts
      # Browser tests: headless Chromium at the build the catalog's Playwright pins, cached by that
      # version. `--with-deps` adds the system libraries it needs even on a cache hit.
      - if: matrix.package == '@alias/browser'
        id: playwright
        run: |
          echo "version=$(sed -n 's/^  playwright: //p' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"
      - if: matrix.package == '@alias/browser'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: matrix.package == '@alias/browser'
        run: pnpm --filter @alias/browser install-browser --with-deps
      - run: pnpm --filter "${{ matrix.package }}" test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, and fakecloud from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alias/web build
      # The publishable SDK bundle: JS plus inlined declarations, only `effect` left external.
      - run: pnpm --filter @alias/sdk build

  # The `alias` CLI as single-file binaries (bun build --compile). Both targets are built on Linux
  # (Bun cross-compiles); the linux-x64 one is smoke-run here, the darwin-arm64 one only on a Mac.
  # Artifacts only: releasing (npm, Homebrew tap) needs the maintainers' accounts.
  cli-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs Node, pnpm, Java, fakecloud and Bun from mise.toml and verifies them against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli:compile linux-x64 darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alias-cli
          path: apps/cli/dist/alias-*
          if-no-files-found: error

packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  # toolchain
  vite-plus: 1.3.0
  "@mpsuesser/oxlint-plugin-effect": 0.6.0
  knip: 6.42.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  typescript: ^7.0.2
  "@types/node": ^24
  # effect
  effect: 4.0.5
  "@effect/vitest": 4.0.5
  "@effect/platform-node": 4.0.5
  # aws (Effect-native SDK, the same one Alchemy uses) and local emulators
  "@distilled.cloud/aws": 1.0.0-rc.15

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

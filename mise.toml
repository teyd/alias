# Toolchain for every checkout, CI job, and devcontainer. `pnpm agent:setup` runs `mise install`.
# mise.lock locks the versions with checksums. Update both files with `mise up --bump && mise lock`.
[tools]
node = "24" # matches the Lambda runtime (nodejs24.x). The engines field in package.json requires >=24.11
pnpm = "12.14.0" # must equal devEngines.packageManager in package.json
java = "temurin-17" # for Amazon DynamoDB Local, the reference DynamoDB emulator
"github:faiscadev/fakecloud" = "0.51.0" # S3 and DynamoDB emulator, a single binary that needs no Docker

[settings]
lockfile = true
